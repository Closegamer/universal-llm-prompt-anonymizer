<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Универсальный анонимизатор промптов LLM</title>
  <desc id="desc">Локальный шлюз, который заменяет личные данные токенами до отправки промпта в облачную LLM.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#0d1426"/>
      <stop offset="1" stop-color="#1b1233"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="23.5" fill="none" stroke="#1e293b"/>

  <circle cx="1040" cy="60" r="160" fill="#7c3aed" opacity="0.10"/>
  <circle cx="1120" cy="260" r="140" fill="#06b6d4" opacity="0.08"/>
  <circle cx="140" cy="250" r="120" fill="#22d3ee" opacity="0.06"/>

  <g filter="url(#glow)">
    <path d="M150 62 L232 92 V162 C232 214 197 248 150 266 C103 248 68 214 68 162 V92 Z" fill="url(#shield)"/>
  </g>
  <path d="M150 84 L212 107 V162 C212 200 186 227 150 242 C114 227 88 200 88 162 V107 Z" fill="#0b1020"/>
  <rect x="132" y="160" width="36" height="30" rx="6" fill="url(#shield)"/>
  <path d="M140 160 V147 A10 10 0 0 1 160 147 V160" fill="none" stroke="url(#shield)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="150" cy="173" r="4" fill="#0b1020"/>
  <path d="M150 176 V184" stroke="#0b1020" stroke-width="4" stroke-linecap="round"/>

  <text x="286" y="126" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1">Универсальный</text>
  <text x="286" y="180" fill="url(#accent)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1">анонимизатор промптов</text>
  <text x="288" y="219" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">Имена, почты, телефоны и другие личные данные остаются на вашем компьютере.</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="288" y="240" width="120" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
    <text x="348" y="260" text-anchor="middle" fill="#67e8f9">OpenCode</text>
    <rect x="418" y="240" width="190" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
    <text x="513" y="260" text-anchor="middle" fill="#a5b4fc">Любой клиент OpenAI</text>
    <rect x="618" y="240" width="140" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
    <text x="688" y="260" text-anchor="middle" fill="#f0abfc">Локальный NER</text>
  </g>
</svg>
